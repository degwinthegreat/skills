<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frontier team の流れ</title>
<!--
  create-frontier-team の描画。外のファイルやネットワークを使わない、単体で開ける1ファイル。
  仕様書の JSON は、すぐ下の script の中身を置き換えて埋め込む（JSON の中の </ は <\/ にする）。
  JSON の形は create-frontier-team の SKILL.md（進め方の3）の1か所で決める。この HTML が読むのは version 1 と 2。
  描画は JSON だけで決まる。列は段の順、行（レーン）は役割の順。配置はすべての段階（phases）を合わせて1回だけ決め、
  段階の切り替え・矢印の切り替え・注記の有無ではカードも線も動かない。
  ほかの道具の注記は、2つめの script（id="overlay"）の中身を同じやり方で置き換えて重ねる（形は SKILL.md の進め方の4）。
  要素には data-node-id・data-edge-id・data-check-id・data-role-id・data-stage-id を付ける。
-->
<script id="design" type="application/json">/*DESIGN*/null</script>
<script id="overlay" type="application/json">/*OVERLAY*/null</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2430; --sub: #5b6475; --line: #d9dde5;
    --lane-a: #ffffff; --lane-b: #f9fafc; --upstream: #7c3aed; --upstream-tint: rgba(124,58,237,.06);
    --task: #0f766e; --plan: #2563eb; --run: #059669; --human: #6b7280; --gap: #dc2626;
    --edge: #8a93a6; --sel: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .repo { color: var(--sub); font-size: 13px; }
  nav { display: flex; gap: 4px; margin-left: 8px; }
  nav button { border: 1px solid var(--line); background: var(--panel); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink); }
  nav button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  nav button .count { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 9px; background: var(--gap); color: #fff; font-size: 11px; }
  .legend { display: flex; gap: 10px; margin-left: auto; font-size: 12px; color: var(--sub); flex-wrap: wrap; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  main { flex: 1; position: relative; min-height: 0; }
  section { position: absolute; inset: 0; overflow: auto; }
  section[hidden] { display: none; }

  #viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; background-image: radial-gradient(#d4d8e0 1px, transparent 1px); background-size: 20px 20px; }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .lane { position: absolute; border-bottom: 1px solid var(--line); }
  .lane-head { position: absolute; padding: 12px; font-size: 13px; border-right: 1px solid var(--line); background: var(--panel); }
  .lane-head b { display: block; font-size: 14px; }
  .lane-head .decides { display: inline-block; margin-top: 6px; font-size: 11px; color: #fff; background: var(--upstream); padding: 1px 7px; border-radius: 9px; }
  .col-head { position: absolute; height: 44px; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); background: var(--panel); }
  .col-head small { font-weight: 400; color: var(--upstream); font-size: 11px; }
  .col-tint { position: absolute; background: var(--upstream-tint); }

  .node { position: absolute; width: 184px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--task); border-radius: 10px; padding: 7px 9px 8px; font-size: 12px; box-shadow: 0 1px 3px rgba(20,30,50,.08); cursor: pointer; user-select: none; }
  .node.upstream { border-left-color: var(--upstream); }
  .node.gap { border: 2px dashed var(--gap); border-left-width: 5px; }
  .node.selected { box-shadow: 0 0 0 3px var(--sel); }
  .node.off { visibility: hidden; }
  .node .top { display: flex; align-items: center; gap: 4px; }
  .node .kind { font-size: 11px; color: var(--sub); white-space: nowrap; margin-right: auto; }
  .node .kind b { font-size: 13px; color: var(--ink); margin-right: 2px; }
  .node .title { font-size: 14px; font-weight: 700; margin: 4px 0 2px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .node .skills { font-size: 11px; color: var(--sub); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip.gapflag::before { content: "⚠ "; }
  .chip.phase-new { background: #e0f2fe; color: #075985; }
  .chip.phase-end { background: #f1f5f9; color: #475569; text-decoration: line-through; }
  .checks-btn { border: 1px solid var(--line); background: #f8fafc; border-radius: 9px; padding: 0 7px; font-size: 11px; line-height: 18px; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 3px; }
  .checks-btn i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .checks-pop { position: absolute; z-index: 6; width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(20,30,50,.18); padding: 8px 10px; font-size: 12px; cursor: default; }
  .checks-pop[hidden] { display: none; }
  .checks-pop h3, #detail h3 { font-size: 12px; margin: 0 0 4px; color: var(--sub); font-weight: 600; }
  ol.checks { list-style: none; margin: 0; padding: 0; }
  ol.checks li { padding: 5px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; align-items: start; position: relative; }
  .checks-pop .pop-foot { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--sub); font-size: 11px; line-height: 1.45; }
  ol.checks li:first-child { border-top: none; }
  ol.checks li b { font-size: 12px; }
  ol.checks li .sub { grid-column: 2; color: var(--sub); font-size: 11px; line-height: 1.45; }
  ol.checks li.gap b { color: var(--gap); }
  .mark { position: absolute; z-index: 4; top: -10px; right: -8px; max-width: 150px; padding: 0 7px; border-radius: 9px; font-size: 11px; line-height: 18px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .mark.inline { position: static; display: inline-block; box-shadow: none; }
  .mark.info { background: #0284c7; } .mark.warn { background: #d97706; } .mark.error { background: #dc2626; } .mark.muted { background: #64748b; }
  .node.marked-muted { opacity: .45; }
  .node .mark.phase { position: absolute; top: -10px; left: 10px; right: auto; z-index: 4; }
  .node .mark.phase.new { background: #0369a1; } .node .mark.phase.end { background: #64748b; }
  path.edge.mark-info { stroke: #0284c7; stroke-opacity: 1; } path.edge.mark-warn { stroke: #d97706; stroke-opacity: 1; } path.edge.mark-error { stroke: #dc2626; stroke-opacity: 1; } path.edge.mark-muted { stroke-opacity: .2; }
  .edge-mark rect { rx: 8; } .edge-mark text { font-size: 11px; fill: #fff; }
  .edge-mark.info rect { fill: #0284c7; } .edge-mark.warn rect { fill: #d97706; } .edge-mark.error rect { fill: #dc2626; } .edge-mark.muted rect { fill: #64748b; }
  .lane-head .actor { display: inline-block; margin-top: 4px; margin-right: 4px; font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); background: #f8fafc; }
  .lane-head .actor.agent { border-color: var(--run); color: var(--run); }
  .lane-head .actor.auto { border-color: var(--human); color: var(--human); }
  .phases { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--sub); }
  .phases button { border: 1px solid var(--line); background: var(--panel); padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .phases button:first-of-type { border-radius: 6px 0 0 6px; } .phases button:last-of-type { border-radius: 0 6px 6px 0; }
  .phases button[aria-pressed="true"] { background: #0369a1; color: #fff; border-color: #0369a1; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 9px; font-size: 11px; line-height: 18px; white-space: nowrap; }
  .chip.session-plan { background: var(--plan); color: #fff; }
  .chip.session-run { background: var(--run); color: #fff; }
  .chip.session-human { background: var(--human); color: #fff; }
  .chip.unknown { background: #fee2e2; color: var(--gap); }
  .chip.layer-upstream { border: 1px solid var(--upstream); color: var(--upstream); }
  .chip.layer-task { border: 1px solid var(--task); color: var(--task); }
  .chip.skill { background: #eef1f6; color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip.gapflag { background: var(--gap); color: #fff; }
  .tool { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 9px; font-size: 11px; line-height: 18px; border: 1px solid; white-space: nowrap; }
  .tool i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .node.gate { border-radius: 2px 18px 2px 18px; }
  .chip.risk-narrow { background: #dcfce7; color: #166534; }
  .chip.risk-wide { background: #fef3c7; color: #92400e; }
  .chip.risk-irreversible { background: #fee2e2; color: #991b1b; font-weight: 600; }
  .chip.humanflag { background: var(--ink); color: #fff; }
  .edge-label { font-size: 11px; fill: var(--sub); }
  .edge-label-bg { fill: var(--bg); }
  path.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-opacity: .55; }
  path.edge.fix, path.edge.learn, path.edge.hl { stroke-opacity: 1; }
  path.edge.back { stroke-dasharray: 6 4; }
  path.edge.fix { stroke: #ea580c; stroke-dasharray: 5 4; }
  path.edge.learn { stroke: var(--upstream); stroke-dasharray: 2 4; stroke-width: 2.2; }
  .legend .toggles label { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; cursor: pointer; }
  .legend .ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--edge); vertical-align: middle; }
  .legend .ln.fix { border-top: 2px dashed #ea580c; }
  .legend .ln.learn { border-top: 2px dotted var(--upstream); }
  path.edge.hl { stroke: var(--sel); stroke-width: 2.6; }

  #detail { position: absolute; right: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(20,30,50,.12); }
  #detail[hidden] { display: none; }
  #detail h2 { font-size: 15px; margin: 0 24px 8px 0; }
  #detail dl { margin: 0; }
  #detail dt { color: var(--sub); font-size: 11px; margin-top: 9px; }
  #detail dd { margin: 2px 0 0; display: flex; flex-wrap: wrap; gap: 4px; }
  #detail .close { position: absolute; right: 10px; top: 8px; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--sub); }
  #detail .gaptext { color: var(--gap); }
  .zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; }
  .zoom button { width: 34px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 14px; }
  .zoom button.wide { width: auto; padding: 0 10px; font-size: 12px; }
  .zoom .hint { margin-left: 8px; padding: 4px 8px; font-size: 12px; color: var(--sub); background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 6px; }

  .doc { padding: 20px 24px; max-width: 1200px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #eef1f6; font-weight: 600; }
  tr.gaprow td { background: #fff5f5; }
  td .row { display: flex; flex-wrap: wrap; gap: 4px; }
  pre.ticket { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
  ul.gaps li { margin: 6px 0; }
  .empty { padding: 40px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1 id="teamName">frontier team の流れ</h1>
  <span class="repo" id="repoName"></span>
  <nav role="tablist">
    <button data-tab="canvasView" aria-selected="true">キャンバス</button>
    <button data-tab="tableView" aria-selected="false">表</button>
    <button data-tab="ticketView" aria-selected="false">チケットの雛形</button>
    <button data-tab="gapView" aria-selected="false">足りないもの<span class="count" id="gapCount" hidden></span></button>
    <button data-tab="markView" aria-selected="false" hidden id="markTab">注記</button>
  </nav>
  <span class="phases" id="phases" hidden></span>
  <div class="legend">
    <span><span class="chip session-plan">計画</span><span class="chip session-run">実行</span><span class="chip session-human">人</span><span class="chip session-human">自動</span>誰が動かすか</span>
    <span><span class="chip layer-upstream">上流</span><span class="chip layer-task">タスク</span>カードの左の線（紫・緑）</span>
    <span><span class="chip risk-narrow">戻せて狭い</span><span class="chip risk-wide">戻せるが広い</span><span class="chip risk-irreversible">戻せない</span>関門</span>
    <span><span class="chip humanflag">人</span>人を置く関門</span>
    <span class="toggles">矢印：<label><input type="checkbox" data-edge="data" checked><i class="ln"></i>データ</label><label><input type="checkbox" data-edge="fix" checked><i class="ln fix"></i>直し</label><label><input type="checkbox" data-edge="learn"><i class="ln learn"></i>学び</label><label><input type="checkbox" id="edgeNames">名前</label></span>
    <span><span class="chip gapflag">スキル無し</span>足りないもの（破線の枠）</span>
  </div>
</header>
<main>
  <section id="canvasView">
    <div id="viewport"><div id="world"><svg id="edges"></svg></div></div>
    <aside id="detail" hidden></aside>
    <div class="zoom">
      <button id="zoomIn" title="拡大（+）" aria-label="拡大">＋</button>
      <button id="zoomOut" title="縮小（-）" aria-label="縮小">－</button>
      <button id="zoomFit" class="wide" title="全体を表示（0）">全体</button>
      <span class="hint">ドラッグ・スクロールで移動 ／ ピンチ・⌘か Ctrl＋スクロールで拡大縮小 ／ キー：＋ − 0（全体）矢印 ／ ノードをクリックで詳細</span>
    </div>
  </section>
  <section id="tableView" hidden><div class="doc" id="tableDoc"></div></section>
  <section id="ticketView" hidden><div class="doc" id="ticketDoc"></div></section>
  <section id="gapView" hidden><div class="doc" id="gapDoc"></div></section>
  <section id="markView" hidden><div class="doc" id="markDoc"></div></section>
</main>
<script>
(() => {
  "use strict";
  const DEFAULT_STAGES = [
    { id: "intent", name: "要求・原則" }, { id: "spec", name: "仕様" }, { id: "tickets", name: "チケット" },
    { id: "plan", name: "計画（依頼）" }, { id: "run", name: "実行" }, { id: "pr", name: "PR" },
    { id: "verify", name: "検証" }, { id: "eval", name: "評価" },
  ];
  const SESSION = { plan: "計画", run: "実行", human: "人" };
  const KIND_IC = { split: ["⑂", "分ける"], work: ["▶", "実行"], code: ["{ }", "コード"], gate: ["◇", "関門"] };
  const KIND = Object.fromEntries(Object.entries(KIND_IC).map(([k, [i, t]]) => [k, i + " " + t]));
  const RISK = { narrow: "戻せて狭い", wide: "戻せるが広い", irreversible: "戻せない" };
  const EDGE_KIND = { data: "データ", fix: "直し", learn: "学び" };
  const LAYER = { upstream: "上流", task: "タスク" };
  const PALETTE = ["#2563eb", "#7c3aed", "#db2777", "#ea580c", "#16a34a", "#0891b2", "#4f46e5", "#ca8a04", "#475569"];

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
  const str = (v, d = "") => (v == null ? d : String(v));
  const arr = (v) => (Array.isArray(v) ? v : v == null || v === "" ? [] : [v]);
  const hashColor = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  const safeColor = (c, key) => (/^#[0-9a-f]{3,8}$/i.test(str(c)) ? c : hashColor(key));

  // ---- 読み込み ----
  const raw = document.getElementById("design").textContent.trim();
  let D = null, parseError = null;
  if (!raw.startsWith("/*DESIGN*/")) { try { D = JSON.parse(raw); } catch (e) { parseError = e.message; } }
  if (!D || typeof D !== "object") {
    document.getElementById("canvasView").replaceChildren(el("div", "empty",
      parseError ? "設計の JSON を読めませんでした：" + parseError
                 : "設計の JSON が埋め込まれていません。id=\"design\" の script の中身を JSON に置き換えてください。"));
    return;
  }

  // ---- ととのえる（欠けたものは足りないものとして残す） ----
  const problems = [];
  const stages = arr(D.stages).length ? arr(D.stages).map((s, i) => ({ id: str(s && s.id, "stage" + i), name: str(s && (s.name || s.id), "段" + (i + 1)) })) : DEFAULT_STAGES.slice();
  const ACTOR = { human: "人", agent: "エージェント", auto: "自動" };
  const roles = arr(D.roles).map((r, i) => ({ id: str(r && r.id, "role" + i), name: str(r && (r.name || r.id), "役割" + (i + 1)), people: r && r.people, actor: str(r && r.actor), decides: !!(r && r.decides), note: str(r && r.note) }));
  // 移行の段階。順のある配列。ノードと辺の since（その段階から在る）・until（その段階から無い）で、段階ごとに出すものを決める。
  const phases = arr(D.phases).map((p, i) => ({ id: str(p && p.id, "phase" + i), name: str(p && (p.name || p.id), "段階" + (i + 1)), note: str(p && p.note) }));
  const phaseIx = new Map(phases.map((p, i) => [p.id, i]));
  const lifeOf = (o, what) => {
    const since = str(o.since), until = str(o.until);
    if (since && !phaseIx.has(since)) problems.push(`${what}の since「${since}」が phases に無い`);
    if (until && !phaseIx.has(until)) problems.push(`${what}の until「${until}」が phases に無い`);
    return { since: phaseIx.has(since) ? since : "", until: phaseIx.has(until) ? until : "" };
  };
  const aliveAt = (o, p) => p < 0 || ((!o.since || phaseIx.get(o.since) <= p) && (!o.until || phaseIx.get(o.until) > p));
  // カードには短い名前（short）を出す。無ければ題名から括弧の中を除いたもの。題名の全文は詳細に出す。
  const shortTitle = (t) => { const s = t.replace(/[（(][^（）()]*[）)]/g, "").replace(/\s+/g, " ").trim(); return s || t; };
  const tools = new Map();
  arr(D.tools).forEach((t, i) => { const id = str(t && t.id, "tool" + i); tools.set(id, { id, name: str(t && (t.name || t.id), id), color: safeColor(t && t.color, id) }); });
  const toolOf = (id) => { if (!tools.has(id)) tools.set(id, { id, name: id, color: hashColor(id) }); return tools.get(id); };

  const stageIx = new Map(stages.map((s, i) => [s.id, i]));
  const roleIx = new Map(roles.map((r, i) => [r.id, i]));
  const nodes = arr(D.nodes).map((n, i) => {
    n = n || {};
    const node = {
      id: str(n.id, "n" + i), title: str(n.title || n.name, "（名前なし）"), stage: str(n.stage), role: str(n.role),
      skills: arr(n.skills).map(String), session: str(n.session), layer: str(n.layer, "task"), tools: arr(n.tools).map(String),
      output: str(n.output), gap: str(n.gap), note: str(n.note),
      kind: str(n.kind), risk: str(n.risk), human: n.human === true, check: str(n.check), short: str(n.short),
    };
    Object.assign(node, lifeOf(n, `ノード「${node.title}」`));
    node.card = node.short || shortTitle(node.title);
    // 関門の中の検査。ノードと同じキー（title・session・check・skills・tools・gap）の小さな形。session を省くと自動。
    node.checks = arr(n.checks).map((c, j) => {
      c = c && typeof c === "object" ? c : { title: str(c) };
      const ck = { id: str(c.id, String(j + 1)), title: str(c.title || c.name, "（名前なし）"), session: str(c.session), check: str(c.check),
        skills: arr(c.skills).map(String), tools: arr(c.tools).map(String), gap: str(c.gap) };

    const vh = viewport.clientHeight; k = 1; tx = 20; ty = Math.max(20, (vh - H) / 2); apply();
  };
  const panBy = (dx, dy) => { tx -= dx; ty -= dy; apply(); };
  // ホイール：そのままなら移動（トラックパッドの二本指、マウスのホイール、Shift＋ホイールで横）。
  // ピンチ（ブラウザは ctrlKey 付きの wheel で送る）と ⌘・Ctrl＋スクロールは拡大縮小。
  viewport.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? viewport.clientHeight : 1;
    let dx = ev.deltaX * unit, dy = ev.deltaY * unit;
    if (ev.ctrlKey || ev.metaKey) {
      const r = viewport.getBoundingClientRect(), d = Math.max(-30, Math.min(30, dy));
      zoomAt(Math.exp(-d * 0.008), ev.clientX - r.left, ev.clientY - r.top); return;
    }
    if (ev.shiftKey && !dx) { dx = dy; dy = 0; }
    panBy(dx, dy);
  }, { passive: false });
  // ドラッグで移動。左ボタンだけで掴み、離した・取り消された・掴みが外れた・フォーカスが外れたときは必ず放す。
  let drag = null;
  const endDrag = () => {
    const d = drag; if (!d) return null;
    drag = null; viewport.classList.remove("dragging");
    try { if (viewport.hasPointerCapture(d.id)) viewport.releasePointerCapture(d.id); } catch (_) { /* 掴みがもう無い */ }
    return d;
  };
  viewport.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0 || ev.target.closest(".node")) return;
    endDrag(); ev.preventDefault();
    drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, tx, ty, moved: false };
    viewport.classList.add("dragging");
    try { viewport.setPointerCapture(ev.pointerId); } catch (_) { /* 掴めなくても、離したときの処理で放す */ }
  });
  viewport.addEventListener("pointermove", (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    if (ev.buttons === 0) { endDrag(); return; }
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true; tx = drag.tx + dx; ty = drag.ty + dy; apply();
  });
  viewport.addEventListener("pointerup", (ev) => { if (!drag || ev.pointerId !== drag.id) return; const d = endDrag(); if (!d.moved) select(null); });
  viewport.addEventListener("pointercancel", endDrag);
  viewport.addEventListener("lostpointercapture", endDrag);
  viewport.addEventListener("dragstart", (ev) => ev.preventDefault());
  window.addEventListener("blur", endDrag);
  document.addEventListener("visibilitychange", () => { if (document.hidden) endDrag(); });
  const center = () => [viewport.clientWidth / 2, viewport.clientHeight / 2];
  document.getElementById("zoomIn").onclick = () => zoomAt(1.2, ...center());
  document.getElementById("zoomOut").onclick = () => zoomAt(1 / 1.2, ...center());
  document.getElementById("zoomFit").onclick = fit;
  // キー：+ と -（JIS の + は Shift＋; なので = も）で拡大縮小、0 で全体、矢印で移動（Shift で大きく）、Esc で選択を外す。
  // ⌘・Ctrl・Alt 付きはブラウザに任せる。
  document.addEventListener("keydown", (ev) => {
    if (document.getElementById("canvasView").hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]")) return;
    const step = ev.shiftKey ? 320 : 80;
    const act = { "+": () => zoomAt(1.2, ...center()), "=": () => zoomAt(1.2, ...center()),
      "-": () => zoomAt(1 / 1.2, ...center()), "_": () => zoomAt(1 / 1.2, ...center()), "0": fit,
      ArrowLeft: () => panBy(-step, 0), ArrowRight: () => panBy(step, 0), ArrowUp: () => panBy(0, -step), ArrowDown: () => panBy(0, step),
      Escape: () => select(null) }[ev.key];
    if (!act) return;
    ev.preventDefault(); act();
  });

  // ---- 注記（ほかの道具が重ねるもの） ----
  // 形：{"version":1,"source":"道具の名前","title":"何の注記か","marks":[{"target":"node:ID | edge:ID | check:ノードID/検査ID","level":"info | warn | error | muted","label":"短い印","text":"詳しく"}]}
  // 注記は印を重ねるだけで、カードの大きさも線も変えない。図に無い対象の印は「注記」のタブに出す。
  const LEVEL = { info: "情報", warn: "注意", error: "問題", muted: "薄く出す" };
  let O = null; const overlayRaw = document.getElementById("overlay").textContent.trim();
  if (!overlayRaw.startsWith("/*OVERLAY*/")) { try { O = JSON.parse(overlayRaw); } catch (e) { problems.push("注記の JSON を読めませんでした：" + e.message); } }
  const marks = (O && typeof O === "object" ? arr(O.marks) : []).map((m, i) => {
    m = m && typeof m === "object" ? m : {};
    const target = str(m.target), [type, ...rest] = target.split(":"), ref = rest.join(":");
    const level = LEVEL[str(m.level)] ? str(m.level) : "info";
    return { i, target, type, ref, level, label: str(m.label, LEVEL[level]), text: str(m.text) };
  });
  const checkByKey = new Map(); nodes.forEach((n) => n.checks.forEach((c) => checkByKey.set(c.key, c)));
  const edgeById = new Map(edges.map((e) => [e.id, e]));
  const marksOf = new Map();
  marks.forEach((m) => {
    m.found = (m.type === "node" && byId.has(m.ref)) || (m.type === "edge" && edgeById.has(m.ref)) || (m.type === "check" && checkByKey.has(m.ref));
    if (!m.found) return;
    const k = m.type + ":" + m.ref; if (!marksOf.has(k)) marksOf.set(k, []); marksOf.get(k).push(m);
  });
  const markBadge = (m, inline) => { const b = el("span", "mark " + m.level + (inline ? " inline" : ""), m.label); b.title = (m.text ? m.label + "：" + m.text : m.label) + (O && O.source ? "（" + str(O.source) + "）" : ""); return b; };
  const worst = (list) => ["error", "warn", "info", "muted"].find((l) => list.some((m) => m.level === l));
  nodes.forEach((n) => {
    const list = marksOf.get("node:" + n.id) || [], d = nodeEls.get(n.id);
    if (list.length) { const b = markBadge(list[0]); if (list.length > 1) b.textContent += ` ＋${list.length - 1}`; d.append(b); }
    if (list.length && list.every((m) => m.level === "muted")) d.classList.add("marked-muted");
    const cm = n.checks.flatMap((c) => marksOf.get("check:" + c.key) || []);
    if (cm.length && !list.length) { const b = markBadge({ level: worst(cm), label: "検査に注記 " + cm.length, text: "" }); d.append(b); }
  });
  edgeEls.forEach(({ e, p }) => {
    const list = marksOf.get("edge:" + e.id) || []; if (!list.length) return;
    const lv = worst(list); p.classList.add("mark-" + lv);
    const pt = e._lp; // 矢印の名前と同じ所（いちばん長い横の線の真ん中）に置く
    const g = s("g", { class: "edge-mark " + lv, "data-edge-id": e.id }); const t = s("text", { x: pt.x, y: pt.y + 4, "text-anchor": "middle" }); t.textContent = list[0].label + (list.length > 1 ? ` ＋${list.length - 1}` : "");
    g.append(t); svg.append(g); const bb = t.getBBox(); g.prepend(s("rect", { x: bb.x - 6, y: bb.y - 2, width: bb.width + 12, height: bb.height + 4 }));
    const tt = s("title", {}); tt.textContent = list.map((m) => m.label + (m.text ? "：" + m.text : "")).join("\n"); g.append(tt);
    e._m = g;
  });
  if (O) {
    const mt = document.getElementById("markTab"); mt.hidden = false; mt.textContent = "注記" + (O.source ? "（" + str(O.source) + "）" : "");
    const t2 = el("table"), hr = el("tr"); ["対象", "印", "詳しく"].forEach((h) => hr.append(el("th", null, h))); t2.append(hr);
    const nameOf = (m) => m.type === "node" ? byId.get(m.ref).title : m.type === "edge" ? `${byId.get(edgeById.get(m.ref).from).title} → ${byId.get(edgeById.get(m.ref).to).title}` : `${byId.get(m.ref.split("/")[0]).title} の検査「${checkByKey.get(m.ref).title}」`;
    marks.forEach((m) => { const tr = el("tr", m.found ? "" : "gaprow"); const c1 = el("td", null, m.found ? nameOf(m) : m.target + "（図に無い）"); const c2 = el("td"); c2.append(markBadge(m, true)); tr.append(c1, c2, el("td", null, m.text)); t2.append(tr); });
    document.getElementById("markDoc").replaceChildren(el("h2", null, str(O.title, "注記")), marks.length ? t2 : el("p", null, "注記はありません。"));
  }

  // ---- 関門の中の検査 ----
  const checksList = (n) => {
    const ol = el("ol", "checks");
    n.checks.forEach((c) => {
      const li = el("li", c.isGap ? "gap" : ""); li.dataset.checkId = c.key;
      li.append(sessionChip(c.session, c.auto), el("b", null, c.title));
      const sub = [];
      if (c.check) sub.push("判定：" + c.check);
      if (c.skills.length) sub.push("スキル：" + c.skills.join("、"));
      if (c.tools.length) sub.push("ツール：" + c.tools.map((t) => toolOf(t).name).join("、"));
      if (c.gap) sub.push("足りない：" + c.gap);
      sub.forEach((x) => li.append(el("span", "sub", x)));
      const ms = marksOf.get("check:" + c.key) || [];
      if (ms.length) { const w = el("span", "sub"); ms.forEach((m) => w.append(markBadge(m, true), " ", m.text, " ")); li.append(w); }
      ol.append(li);
    });
    return ol;
  };
  let pop = null;
  const closeChecks = () => { if (pop) { pop.remove(); pop = null; } };
  const toggleChecks = (id) => {
    // 開くのはカードの下の小さな窓だけ（右の詳細は開かない。同じ中身が2つ並ばないように）。
    const was = pop && pop.dataset.nodeId === id; closeChecks(); select(id, true); if (was) return;
    const n = byId.get(id), p = pos.get(id);
    pop = el("div", "checks-pop"); pop.dataset.nodeId = id;
    pop.append(el("h3", null, `中の検査（${n.checks.length}）`), checksList(n));
    if (n.check) pop.append(el("div", "pop-foot", "通す条件：" + n.check));
    Object.assign(pop.style, { left: p.x + "px", top: p.y + p.h + 6 + "px" });
    pop.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    world.append(pop);
  };

  // 詳細
  const detail = document.getElementById("detail");
  const phaseRange = (o) => o.since || o.until ? `${o.since ? phases[phaseIx.get(o.since)].name : phases[0].name} から` + (o.until ? `（${phases[phaseIx.get(o.until)].name} で無くなる）` : "") : "すべての段階";
  const select = (id, noDetail) => {
    if (!id || (pop && pop.dataset.nodeId !== id)) closeChecks();
    nodeEls.forEach((e, nid) => e.classList.toggle("selected", nid === id));
    edgeEls.forEach(({ e, p }) => { const on = id && (e.from === id || e.to === id); p.classList.toggle("hl", !!on); p.setAttribute("marker-end", on ? "url(#arrowhl)" : "url(#arrow)"); });
    selectedId = id; refreshEdges();
    if (!id || noDetail) { detail.hidden = true; return; }
    const n = byId.get(id);
    const close = el("button", "close", "×"); close.onclick = () => select(null);
    const dl = el("dl");
    const item = (label, ...content) => { dl.append(el("dt", null, label)); const dd = el("dd"); content.forEach((c) => dd.append(typeof c === "string" ? el("span", null, c) : c)); dl.append(dd); };
    const ms = marksOf.get("node:" + id) || [];
    if (ms.length) item("注記" + (O && O.source ? "（" + str(O.source) + "）" : ""), ...ms.flatMap((m) => [markBadge(m, true), m.text]));
    item("段", stageName(n.stage));
    item("役割", roleName(n.role));
    if (phases.length) item("段階", phaseRange(n));
    item("セッション", sessionChip(n.session, n.auto));
    item("層", layerChip(n.layer));
    item("種類", KIND[n.kind] || "不明");
    if (n.kind === "gate") item("戻しにくさ", riskChip(n.risk));
    if (n.human) item("人", el("span", "chip humanflag", "人を置く関門"));
    if (n.check) item(n.checks.length ? "通す条件" : "判定", n.check);
    if (n.checks.length) item(`中の検査（${n.checks.length}）`, checksList(n));
    item("スキル", ...(n.skills.length ? n.skills.map((x) => el("span", "chip skill", x)) : ["無し"]));
    item("ツール", ...(n.tools.length ? n.tools.map(toolBadge) : ["無し"]));
    if (n.output) item("成果物", n.output);
    const tag = (e) => (e.kind !== "data" ? `［${EDGE_KIND[e.kind]}］` : "") + (e.label ? `（${e.label}）` : "") + ((marksOf.get("edge:" + e.id) || []).length ? "［注記：" + marksOf.get("edge:" + e.id).map((m) => m.label + (m.text ? " " + m.text : "")).join("、") + "］" : "");
    const ins = edges.filter((e) => e.to === id && edgeAlive(e)).map((e) => byId.get(e.from).title + tag(e));
    const outs = edges.filter((e) => e.from === id && edgeAlive(e)).map((e) => byId.get(e.to).title + tag(e));
    item("受け取る", ins.length ? ins.join("、") : "無し");
    item("渡す", outs.length ? outs.join("、") : "無し");
    if (n.note) item("メモ", n.note);
    if (n.isGap) { const g = el("span", "gaptext", n.gap || ("欠けている：" + n.gapTags.join("、"))); item("足りないもの", g); }
    detail.replaceChildren(close, el("h2", null, n.title), dl); detail.hidden = false;
  };
  nodeEls.forEach((e, id) => e.addEventListener("click", (ev) => { ev.stopPropagation(); select(id); }));

  // ---- 表 ----
  const sorted = nodes.slice().sort((a, b) => stageIx.get(a.stage) - stageIx.get(b.stage) || roleIx.get(a.role) - roleIx.get(b.role));
  const table = el("table"), thead = el("tr");
  ["段", "役割", "ノード", "種類", "スキル", "セッション", "ツール", "成果物", "層"].concat(phases.length ? ["段階"] : []).forEach((h) => thead.append(el("th", null, h)));
  table.append(thead);
  sorted.forEach((n) => {
    const tr = el("tr", n.isGap ? "gaprow" : "");
    const cell = (...c) => { const td = el("td"); const r = el("div", "row"); c.forEach((x) => r.append(typeof x === "string" ? el("span", null, x) : x)); td.append(r); tr.append(td); return td; };
    cell(stageName(n.stage)); cell(roleName(n.role));
    const tc = cell(n.title); if (n.checks.length) tc.append(checksList(n));
    cell(...[KIND[n.kind] || "—"].concat(n.kind === "gate" ? [riskChip(n.risk)] : [], n.human ? [el("span", "chip humanflag", "人")] : []));
    cell(...(n.skills.length ? n.skills.map((x) => el("span", "chip skill", x)) : [el("span", "chip gapflag", "無し")]));
    cell(sessionChip(n.session, n.auto)); cell(...(n.tools.length ? n.tools.map(toolBadge) : ["—"])); cell(n.output || "—"); cell(layerChip(n.layer));
    if (phases.length) cell(phaseRange(n));
    table.append(tr);
  });
  document.getElementById("tableDoc").replaceChildren(el("h2", null, "役割 × 段 × スキル × セッション × ツール"), table);

  // ---- チケットの雛形 ----
  const tt = str(D.ticket_template);
  document.getElementById("ticketDoc").replaceChildren(el("h2", null, "チケットの雛形"), tt ? el("pre", "ticket", tt) : el("p", "empty", "設計にチケットの雛形がありません。"));

  // ---- 足りないもの（選んでいる段階で数える。段階が無ければ全部） ----
  const renderGaps = () => {
    const ns = nodes.filter(nodeAlive), es = edges.filter(edgeAlive);
    const gaps = [];
    stages.forEach((s) => { const inStage = ns.filter((n) => n.stage === s.id); if (!inStage.length) gaps.push(`段「${s.name}」にノードが無い`); else if (inStage.every((n) => n.isGap)) gaps.push(`段「${s.name}」に、スキルの決まったノードが無い`); });
    // 検査だけが足りないノードは、下の検査ごとの行で出す。
    ns.filter((n) => n.isGap && (n.gap || n.gapTags.some((t) => !t.startsWith("足りない検査")))).forEach((n) => gaps.push(`${stageName(n.stage)} / ${roleName(n.role)} の「${n.title}」：${n.gap || "欠けている：" + n.gapTags.filter((t) => !t.startsWith("足りない検査")).join("、")}`));
    ns.forEach((n) => n.checks.filter((c) => c.isGap).forEach((c) => gaps.push(`関門「${n.title}」の検査「${c.title}」：${c.gap}`)));
    const task = ns.filter((n) => n.layer !== "upstream");
    if (!es.some((e) => e.kind === "learn")) gaps.push("学びの辺が無い（評価から、分ける所の指示か上流へ戻す矢印）。速くはなっても、賢くならない");
    if (!es.some((e) => e.kind === "fix")) gaps.push("直しの辺が無い（関門から、その単位を作った実行へ差し戻す矢印）");
    const humans = ns.filter((n) => n.human);
    if (humans.length !== 1) gaps.push(`人を置く関門が ${humans.length} か所（1か所、いちばん重くて戻しにくい所に置く）`);
    task.filter((n) => n.session === "human" && !n.human).forEach((n) => gaps.push(`「${n.title}」：タスクの流れの途中に人がいる。人を置くのは1か所に絞る`));
    ns.filter((n) => n.kind === "gate" && !RISK[n.risk]).forEach((n) => gaps.push(`関門「${n.title}」：戻しにくさが書かれていない`));
    ns.filter((n) => n.kind === "gate" && n.risk === "irreversible" && !n.human).forEach((n) => gaps.push(`関門「${n.title}」：戻せない変更を、人を置かずに通している`));
    ns.filter((n) => (n.kind === "work" || n.kind === "gate") && !n.check && !(n.checks.length && n.checks.every((c) => c.check))).forEach((n) => gaps.push(`「${n.title}」：判定（プログラムで評価できる形）が書かれていない`));
    task.filter((n) => !KIND[n.kind]).forEach((n) => gaps.push(`「${n.title}」：ノードの種類（分ける・実行・コード・関門）が書かれていない`));
    if (D.version == null) gaps.push("仕様書に version が無い（この図は version 2 の形として読んだ）");
    else if (![1, 2].includes(Number(D.version))) gaps.push(`仕様書の version が ${D.version}（この図が読むのは version 1 と 2）`);
    arr(D.gaps).forEach((g) => gaps.push(str(typeof g === "object" && g ? (g.text || g.title || JSON.stringify(g)) : g)));
    problems.forEach((p) => gaps.push(p));
    const ul = el("ul", "gaps"); gaps.forEach((g) => ul.append(el("li", null, g)));
    const h = "足りないもの" + (phase >= 0 ? `（段階：${phases[phase].name}）` : "");
    document.getElementById("gapDoc").replaceChildren(el("h2", null, h), gaps.length ? ul : el("p", null, "見つかりませんでした。"));
    const gc = document.getElementById("gapCount"); gc.textContent = gaps.length; gc.hidden = !gaps.length;
  };

  // ---- 段階の切り替え（既定は最後の段階＝目指す形。「全部」はすべてを重ねて出す） ----
  const refreshPhase = () => {
    nodes.forEach((n) => {
      const d = nodeEls.get(n.id), b = n._phaseBadge;
      d.classList.toggle("off", !nodeAlive(n));
      let txt = "", cls = "";
      if (phases.length && phase >= 0) {
        if (n.since && phaseIx.get(n.since) === phase && phase > 0) { txt = "＋ この段階で足す"; cls = "new"; }
        else if (n.until && phaseIx.get(n.until) === phase + 1) { txt = "次の段階で無くなる"; cls = "end"; }
      } else if (phases.length && (n.since || n.until)) { txt = phaseRange(n); cls = n.until ? "end" : "new"; }
      b.textContent = txt; b.hidden = !txt; b.className = "mark phase " + cls;
    });
    document.querySelectorAll("#phases button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.phase) === phase)));
    if (selectedId && !nodeAlive(byId.get(selectedId))) select(null); else if (selectedId) select(selectedId, detail.hidden);
    refreshEdges(); renderGaps();
  };
  if (phases.length) {
    const box = document.getElementById("phases"); box.hidden = false; box.append(el("span", null, "段階："));
    phases.map((p, i) => [p.name, i]).concat([["全部", -1]]).forEach(([name, i]) => {
      const b = el("button", null, name); b.type = "button"; b.dataset.phase = i; if (i >= 0 && phases[i].note) b.title = phases[i].note;
      b.addEventListener("click", () => { phase = i; refreshPhase(); }); box.append(b);
    });
  }
  refreshPhase();

  // ---- タブ ----
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    document.querySelectorAll("main > section").forEach((sec) => { sec.hidden = sec.id !== b.dataset.tab; });
    if (b.dataset.tab === "canvasView") home();
  }));
  home();
  window.addEventListener("resize", home);
})();
</script>
</body>
