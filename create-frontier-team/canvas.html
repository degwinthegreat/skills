<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frontier team の流れ</title>
<!--
  create-frontier-team の描画。外のファイルやネットワークを使わない、単体で開ける1ファイル。
  仕様書の JSON は、すぐ下の script の中身を置き換えて埋め込む（JSON の中の </ は <\/ にする）。
  JSON の形は create-frontier-team の SKILL.md（進め方の3）の1か所で決める。この HTML が読むのは version 1 と 2。
  見せ方は docs/specs/frontier-canvas.md（設計書）で決めた。見方は3つ：a 全体を掴む（既定）、b 次に直す、c 移行。
  配置（役割の行 × 段の列）と線の割り当ては、すべての段階のノードとすべての種類の辺を合わせて1回だけ決め、
  見方・段階・選び・注記を切り替えても、カードも線も動かない（出す・隠すだけ）。
  ほかの道具の注記は、2つめの script（id="overlay"）の中身を同じやり方で置き換えて重ねる（形は SKILL.md の進め方の4）。
  要素には data-node-id・data-edge-id・data-check-id・data-role-id・data-stage-id を付ける。
-->
<script id="design" type="application/json">/*DESIGN*/null</script>
<script id="overlay" type="application/json">/*OVERLAY*/null</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fbfaf7; color: #2b2a28; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button { font: inherit; color: inherit; }

  /* 見方の切り替え（右上）と表 */
  #top { position: fixed; top: 18px; right: 24px; display: flex; align-items: center; gap: 16px; font-size: 13px; z-index: 5; }
  #views { display: flex; gap: 18px; }
  #views button, #tableBtn { border: 0; background: none; padding: 4px 0; cursor: pointer; color: #857f76; border-bottom: 2px solid transparent; }
  #views button[aria-selected="true"] { color: #2b2a28; font-weight: 600; border-bottom-color: #2b2a28; }
  body[data-table] #views button[aria-selected="true"] { font-weight: 400; border-bottom-color: transparent; color: #5d5850; }
  #tableBtn[aria-pressed="true"] { color: #2b2a28; font-weight: 600; border-bottom-color: #2b2a28; }
  #top .sep { width: 1px; height: 14px; background: #d8d1c5; }
  #top button:focus-visible, #panel :focus-visible, #tip :focus-visible, #table :focus-visible { outline: 2px solid #2b2a28; outline-offset: 2px; border-radius: 3px; }

  /* 図 */
  #wrap { position: fixed; inset: 0; }
  body[data-view="b"] #wrap, body[data-view="c"] #wrap { right: 270px; }
  body[data-fold][data-view="b"] #wrap, body[data-fold][data-view="c"] #wrap { right: 34px; }
  #v { width: 100%; height: 100%; display: block; }
  .card { cursor: pointer; }
  .card:focus { outline: none; }
  .card .focus { display: none; }
  .card:focus-visible .focus { display: inline; }
  .empty { padding: 60px 40px; color: #5d5850; font-size: 14px; }

  /* 横の一覧（b・c） */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 270px; padding: 62px 16px 20px; background: #f6f3ee; border-left: 1px solid #e3ded5; overflow: auto; font-size: 12.5px; line-height: 1.6; display: none; }
  body[data-view="b"] #panel, body[data-view="c"] #panel { display: block; }
  body[data-fold] #panel { width: 34px; padding: 62px 0 0; overflow: hidden; }
  body[data-fold] #panel > :not(#fold) { display: none; }
  #fold { display: none; margin: 0 0 6px auto; border: 1px solid #d8d1c5; background: #fff; border-radius: 6px; padding: 1px 8px; font-size: 11.5px; color: #5d5850; cursor: pointer; }
  body[data-narrow] #fold { display: block; }
  body[data-fold] #fold { writing-mode: vertical-rl; margin: 0 auto; padding: 8px 2px; }
  #panel h2 { font-size: 13px; margin: 6px 0 4px; color: #3d3b38; }
  #panel .sub { color: #857f76; margin: 0 0 10px; }
  [role="listbox"] { margin: 0 0 12px; outline: none; }
  [role="option"] { cursor: pointer; }
  .tier { color: #857f76; font-size: 11px; letter-spacing: .08em; margin: 12px 0 4px; }
  .g { background: #fff; border: 1px solid #e6e1d8; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .g b { display: block; font-size: 13px; }
  .g span { color: #5d5850; }
  .g.first { border-color: #c23a22; }
  .g.first b::after { content: "　次に直す"; color: #c23a22; font-size: 11px; font-weight: 600; }
  .g[aria-selected="true"], .d[aria-selected="true"] { box-shadow: 0 0 0 1.5px #4a4642; }
  .ph { padding: 7px 10px; border-radius: 8px; margin-bottom: 4px; border: 1px solid transparent; }
  .ph[aria-selected="true"] { background: #fff; border-color: #d8d1c5; }
  .ph b { font-size: 13px; display: block; }
  .ph .n { display: block; color: #857f76; font-size: 11.5px; }
  .ph small { display: block; color: #5d5850; }
  .d { background: #fff; border: 1px solid #e6e1d8; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .d b { display: inline-block; min-width: 6.6em; font-size: 12px; }
  .d span { color: #3d3b38; }

  /* 詳細の窓（popover。モーダルにしない） */
  #tip { position: fixed; width: 350px; padding: 12px 14px; font-size: 12px; line-height: 1.65; background: #fff; border: 1px solid #e3ded5; border-radius: 10px; box-shadow: 0 2px 8px rgba(90,74,48,.10); z-index: 6; }
  #tip[hidden] { display: none; }
  #tip h2 { font-size: 14px; margin: 0 26px 6px 0; }
  #tip .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 16px; color: #857f76; cursor: pointer; padding: 0 4px; }
  #tip .r > span:first-child { display: inline-block; width: 6.4em; color: #857f76; vertical-align: top; }
  #tip.dock { column-width: 250px; column-gap: 24px; font-size: 11.5px; line-height: 1.55; padding: 10px 14px; overflow: auto; box-shadow: none; }
  #tip.dock h2 { column-span: all; }
  #tip.dock .r, #tip.dock li { break-inside: avoid; }
  #tip ul { list-style: none; padding: 0; margin: 4px 0 0; }
  #tip li { margin: 0 0 6px; padding-left: 14px; position: relative; }
  #tip li i { position: absolute; left: 0; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: #b8b0a3; }
  #tip li i.hum { background: #b0713f; }
  #tip li i.gap { background: #fff; border: 1.4px solid #5d5850; }
  #tip li i.gap1 { background: #c23a22; }
  #tip li b { margin-right: 6px; }
  #tip li em { font-style: normal; color: #857f76; margin-right: 6px; }
  #tip li strong { display: block; font-weight: 600; color: #3d3b38; }
  #tip li strong.first { color: #c23a22; }
  #tip li[aria-current="true"] { background: #f6f3ee; border-radius: 4px; }

  /* 表（見方とは別の、全文を読む・探す・印刷する所） */
  #table { position: fixed; inset: 0; overflow: auto; padding: 64px 28px 28px; background: #fbfaf7; font-size: 12.5px; line-height: 1.55; }
  #table[hidden] { display: none; }
  #table h2 { font-size: 15px; margin: 0 0 10px; color: #3d3b38; }
  #table h3 { font-size: 13px; margin: 22px 0 8px; color: #3d3b38; }
  #table table { border-collapse: collapse; width: 100%; background: #fff; }
  #table th, #table td { border: 1px solid #e3ded5; padding: 6px 8px; text-align: left; vertical-align: top; }
  #table th { background: #f3f0eb; font-weight: 600; white-space: nowrap; }
  #table td:nth-child(-n+2) { white-space: nowrap; }
  #table code { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }
  #table ol { margin: 4px 0 0; padding-left: 18px; color: #5d5850; }
  @media print { #top { display: none; } #table { position: static; padding: 0; } }
</style>
</head>
<body data-view="a">
<nav id="top" aria-label="見方">
  <div role="tablist" id="views" aria-label="見方">
    <button type="button" role="tab" id="tab-a" data-v="a" aria-controls="wrap">全体を掴む</button>
    <button type="button" role="tab" id="tab-b" data-v="b" aria-controls="wrap">次に直す</button>
    <button type="button" role="tab" id="tab-c" data-v="c" aria-controls="wrap">移行</button>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="tableBtn" aria-pressed="false" aria-controls="table">表</button>
</nav>
<h1 class="sr" id="headline"></h1>
<div id="live" class="sr" aria-live="polite"></div>
<main id="wrap" role="tabpanel"></main>
<aside id="panel" aria-label="一覧"></aside>
<div id="tip" role="dialog" aria-modal="false" aria-labelledby="tipTitle" hidden></div>
<section id="table" aria-label="表" hidden></section>
<script>
(() => {
  "use strict";
  // ---- 小さな道具 ----
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
  const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  const tx = (parent, x, y, text, attrs = {}) => { const t = sv("text", Object.assign({ x, y }, attrs), parent); t.textContent = text; return t; };
  const str = (v, d = "") => (v == null ? d : String(v));
  const arr = (v) => (Array.isArray(v) ? v : v == null || v === "" ? [] : [v]);
  const uniq = (a) => [...new Set(a)];
  const groupBy = (list, key) => { const m = new Map(); list.forEach((x) => { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };

  // ---- 色と書体（設計書の「地と色」） ----
  const INK = "#2b2a28", HEADC = "#3d3b38", SUB = "#857f76", RULE = "#e3ded5", ALT = "#f3f0eb", BG = "#fbfaf7", GAPINK = "#5d5850";
  const HUM = "#b0713f", HUMBG = "#f5eadf", HUMTX = "#87512a"; // 人の関わり：彩度を抑えたアンバー
  const AGBG = "#e9eef5", AGTX = "#46607e";                     // エージェント：彩度を抑えた青
  const RED = "#c23a22";                                         // 赤は b の 1 位だけ
  const GOTH = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif', MONO = '"SF Mono",Menlo,monospace';

  const wrap = document.getElementById("wrap");
  // ---- 読み込み ----
  const raw = document.getElementById("design").textContent.trim();
  let D = null, parseError = null;
  if (!raw.startsWith("/*DESIGN*/")) { try { D = JSON.parse(raw); } catch (e) { parseError = e.message; } }
  if (!D || typeof D !== "object") {
    wrap.replaceChildren(el("div", "empty", parseError ? "設計の JSON を読めませんでした：" + parseError
      : "設計の JSON が埋め込まれていません。id=\"design\" の script の中身を JSON に置き換えてください。"));
    document.getElementById("top").hidden = true;
    return;
  }

  // ---- ととのえる（欠けたものは足りないものとして残す） ----
  const DEFAULT_STAGES = [
    { id: "intent", name: "要求・原則" }, { id: "spec", name: "仕様" }, { id: "tickets", name: "チケット" },
    { id: "plan", name: "計画（依頼）" }, { id: "run", name: "実行" }, { id: "pr", name: "PR" },
    { id: "verify", name: "検証" }, { id: "eval", name: "評価" },
  ];
  const SESSION = { plan: "計画", run: "実行", human: "人" };
  const KIND = { split: "分ける", work: "作業", code: "コード", gate: "関門" };
  const RISK = { irreversible: "戻せない", wide: "戻せるが広い", narrow: "戻せて狭い" };
  const RISKS = { irreversible: "戻せない", wide: "広い", narrow: "狭い" };
  const RR = { irreversible: 0, wide: 1, narrow: 2 };
  const EDGE_KIND = { data: "データ", fix: "直し", learn: "学び" };
  const GROUP = { input: "入力", routing: "振り分け", candidate: "候補", output: "出力" };
  const INVL = { human: "人", cond: "条件で人", agent: "エージェント", auto: "自動" };
  const problems = [];

  const stages = arr(D.stages).length
    ? arr(D.stages).map((s, i) => ({ id: str(s && s.id, "stage" + i), name: str(s && (s.name || s.id), "段" + (i + 1)), group: GROUP[str(s && s.group)] ? s.group : "" }))
    : DEFAULT_STAGES.map((s) => Object.assign({ group: "" }, s));
  const roles = arr(D.roles).map((r, i) => ({ id: str(r && r.id, "role" + i), name: str(r && (r.name || r.id), "役割" + (i + 1)), people: r && r.people, actor: str(r && r.actor), decides: !!(r && r.decides) }));
  // 移行の段階。順のある配列。ノード・辺・検査の since（その段階から在る）・until（その段階から無い）で、段階ごとに出すものを決める。
  const phases = arr(D.phases).map((p, i) => ({ id: str(p && p.id, "phase" + i), name: str(p && (p.name || p.id), "段階" + (i + 1)), note: str(p && p.note), current: !!(p && p.current === true) }));
  const phaseIx = new Map(phases.map((p, i) => [p.id, i]));
  const NP = Math.max(1, phases.length);
  const lifeOf = (o, what) => {
    const since = str(o.since), until = str(o.until);
    if (since && !phaseIx.has(since)) problems.push(`${what}の since「${since}」が phases に無い`);
    if (until && !phaseIx.has(until)) problems.push(`${what}の until「${until}」が phases に無い`);
    return { since: phaseIx.has(since) ? since : "", until: phaseIx.has(until) ? until : "" };
  };
  const aliveAt = (o, p) => (!o.since || phaseIx.get(o.since) <= p) && (!o.until || phaseIx.get(o.until) > p);
  // gap と human_if は、文か、段階を付けた {text, since, until}（その配列も可）。段階を付けたものは、その段階でだけ在る。
  const textsOf = (v, what) => arr(v).map((g) => g && typeof g === "object" ? Object.assign({ text: str(g.text) }, lifeOf(g, what)) : { text: str(g), since: "", until: "" }).filter((g) => g.text);
  const textAt = (list, p) => list.filter((g) => aliveAt(g, p)).map((g) => g.text).join("／");
  const shortTitle = (t) => { const s = t.replace(/[（(][^（）()]*[）)]/g, "").replace(/\s+/g, " ").trim(); return s || t; };
  const toolName = new Map(arr(D.tools).map((t, i) => [str(t && t.id, "tool" + i), str(t && (t.name || t.id), "tool" + i)]));

  const stageIx = new Map(stages.map((s, i) => [s.id, i]));
  const roleIx = new Map(roles.map((r, i) => [r.id, i]));
  const nodes = arr(D.nodes).map((n, i) => {
    n = n || {};
    const node = {
      id: str(n.id, "n" + i), title: str(n.title || n.name, "（名前なし）"), stage: str(n.stage), role: str(n.role),
      skills: arr(n.skills).map(String), session: str(n.session), layer: str(n.layer, "task"), tools: arr(n.tools).map(String),
      output: str(n.output), kind: str(n.kind), risk: str(n.risk), human: n.human === true, check: str(n.check), short: str(n.short),
    };
    Object.assign(node, lifeOf(n, `ノード「${node.title}」`));
    node.gaps = textsOf(n.gap, `ノード「${node.title}」の gap`);
    node.conds = textsOf(n.human_if, `ノード「${node.title}」の human_if`);
    node.card = node.short || shortTitle(node.title);
    // 関門の中の検査。段階で検査が増えたり減ったりしても、検査の ID（id、無ければ並びの番号）は変わらない。
    node.checks = arr(n.checks).map((c, j) => {
      c = c && typeof c === "object" ? c : { title: str(c) };
      const ck = { id: str(c.id, String(j + 1)), title: str(c.title || c.name, "（名前なし）"), session: str(c.session), check: str(c.check), skills: arr(c.skills).map(String), tools: arr(c.tools).map(String) };
      Object.assign(ck, lifeOf(c, `検査「${node.title}／${ck.title}」`));
      ck.gaps = textsOf(c.gap, `検査「${node.title}／${ck.title}」の gap`);
      ck.key = node.id + "/" + ck.id;
      return ck;
    });
    if (!stageIx.has(node.stage)) { const id = node.stage || "_nostage"; if (!stageIx.has(id)) { stageIx.set(id, stages.length); stages.push({ id, name: node.stage || "（段なし）", group: "" }); } node.stage = id; }
    if (!roleIx.has(node.role)) { const id = node.role || "_norole"; if (!roleIx.has(id)) { roleIx.set(id, roles.length); roles.push({ id, name: node.role || "（役割なし）", missing: true }); } node.role = id; }
    node.missing = [];
    node.auto = !SESSION[node.session] && (node.kind === "code" || node.kind === "gate");
    // 人（actor が human）の行で session を省いた作業は、人が動かす作業とみなす。
    if (!SESSION[node.session] && !node.auto && roles[roleIx.get(node.role)].actor === "human") node.session = "human";
    if (!SESSION[node.session] && !node.auto) node.missing.push("セッション");
    if (roles[roleIx.get(node.role)].missing) node.missing.push("役割");
    // 人が動かす作業とコードは、スキルが無くても足りないものにしない。エージェントのセッション（計画・実行）の作業は、スキルが無ければ足りない。
    node.wantsSkill = node.skills.length === 0 && (node.session === "plan" || node.session === "run") && node.kind !== "code";
    return node;
  });
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const checkByKey = new Map(); nodes.forEach((n) => n.checks.forEach((c) => checkByKey.set(c.key, c)));
  const edges = [];
  const edgeIds = new Set();
  arr(D.edges).forEach((e, i) => {
    e = e || {};
    const from = str(e.from), to = str(e.to);
    if (!byId.has(from) || !byId.has(to)) { problems.push(`矢印 ${i + 1}（${from || "?"} → ${to || "?"}）の端のノードが無い`); return; }
    const kind = EDGE_KIND[str(e.kind)] ? str(e.kind) : "data";
    // 辺の ID：仕様書に id があればそれ、無ければ「from>to:kind」。重なったときだけ、出てきた順に #2, #3 を付ける。
    const base = str(e.id) || `${from}>${to}:${kind}`;
    let id = base; for (let k = 2; edgeIds.has(id); k++) id = base + "#" + k;
    edgeIds.add(id);
    edges.push(Object.assign({ id, i: edges.length, from, to, label: str(e.label), kind }, lifeOf(e, `矢印「${id}」`)));
  });
  const edgeById = new Map(edges.map((e) => [e.id, e]));
  // きっかけ：誰が・何で流れを始めるか。行き先のノードが選んだ段階に無ければ出さない。
  const TRIG = { human: 1, schedule: 1, event: 1 };
  const triggers = arr(D.triggers).map((t, i) => {
    t = t && typeof t === "object" ? t : {};
    const to = str(t.to), by = str(t.by);
    if (!byId.has(to)) { problems.push(`きっかけ ${i + 1} の行き先のノード「${to}」が無い`); return null; }
    if (!TRIG[by]) problems.push(`きっかけ ${i + 1} の by「${by}」が human・schedule・event のどれでもない`);
    return { to, by: TRIG[by] ? by : "event", role: str(t.role), label: str(t.label) };
  }).filter(Boolean);

  const team = str(D.team, "frontier team"), repo = str(D.repo);
  const teamLine = team + (repo ? "（" + repo + "）" : "");
  document.title = team + " の流れ";
  const stName = (id) => stages[stageIx.get(id)].name;
  const roName = (id) => roles[roleIx.get(id)].name;
  const phName = (p) => (phases.length ? phases[p].name : "");
  const short = (id) => byId.get(id).card;

  // ---- 人の関わり（設計書「人の関わりときっかけ」の 1。上から順に、最初に当たったもの） ----
  const condAt = (n, p) => textAt(n.conds, p);
  const INV = (n, p) => {
    if (condAt(n, p)) return "cond";
    if (n.human || n.session === "human") return "human";
    if (n.layer === "upstream" && roles[roleIx.get(n.role)].decides) return "human";
    if (n.session === "plan" || n.session === "run") return "agent";
    return "auto";
  };

  // ---- 段階 p でのノードの足りないもの ----
  const stateAt = (n, p) => {
    const checks = n.checks.filter((c) => aliveAt(c, p));
    const gap = textAt(n.gaps, p);
    const noSkill = n.wantsSkill && !checks.length; // 中の検査があるときは、検査ごとに見る
    const checkGaps = checks.filter((c) => textAt(c.gaps, p));
    const own = !!gap || n.missing.length > 0 || noSkill;
    const tags = n.missing.map((m) => m + "が不明").concat(noSkill ? ["スキル無し"] : []);
    return { checks, gap, noSkill, checkGaps, tags, own, isGap: own || checkGaps.length > 0 };
  };

  // ---- 足りないものと重さの順（設計書の決まったこと 7。数え方は前の図と同じ） ----
  // 1 戻しにくさ → 2 人の関門と戻り道 → 3 エージェントの段のスキル → 4 検査 → 5 書き漏れ。同じ順の中は流れの上流から。
  const TIER = { 1: "戻しにくさ", 2: "人の関門と戻り道", 3: "スキル", 4: "検査", 5: "書き漏れ" };
  const gapsMemo = new Map();
  const gapsAt = (p) => {
    if (gapsMemo.has(p)) return gapsMemo.get(p);
    const ns = nodes.filter((n) => aliveAt(n, p)), ids = new Set(ns.map((n) => n.id));
    const es = edges.filter((e) => aliveAt(e, p) && ids.has(e.from) && ids.has(e.to));
    const st = new Map(ns.map((n) => [n.id, stateAt(n, p)]));
    const out = [];
    const add = (tier, sub, text, nodeIds, stage, checks = [], scope = "node") => out.push({ tier, sub, text, nodes: nodeIds, stage, checks, scope });
    const last = stages[stages.length - 1].id;
    stages.forEach((s) => {
      const ins = ns.filter((n) => n.stage === s.id);
      if (!ins.length) add(5, 0, `段「${s.name}」にノードが無い`, [], s.id, [], "stage");
      else if (ins.every((n) => st.get(n.id).isGap)) add(3, 0, `段「${s.name}」に、スキルの決まったノードが無い`, ins.map((n) => n.id), s.id);
    });
    ns.forEach((n) => {
      const x = st.get(n.id); if (!x.own) return;
      const text = x.gap || "欠けている：" + x.tags.join("、");
      if (n.kind === "gate") add(1, RR[n.risk] ?? 3, text, [n.id], n.stage);
      else if (n.session === "plan" || n.session === "run") add(3, 0, text, [n.id], n.stage);
      else add(5, 0, text, [n.id], n.stage);
    });
    ns.forEach((n) => st.get(n.id).checkGaps.forEach((c) => add(4, RR[n.risk] ?? 3, textAt(c.gaps, p), [n.id], n.stage, [c.key])));
    if (!es.some((e) => e.kind === "learn")) add(2, 0, "学びの辺が無い（評価から、分ける所か入力へ戻す矢印）", [], last, [], "flow");
    if (!es.some((e) => e.kind === "fix")) add(2, 0, "直しの辺が無い（関門から、その単位を作った実行へ差し戻す矢印）", [], last, [], "flow");
    const humans = ns.filter((n) => n.human);
    if (humans.length !== 1) add(2, 0, `人を置く関門が ${humans.length} か所（1 か所、いちばん重くて戻しにくい所に置く）`, humans.map((n) => n.id), (humans[0] || ns[0] || { stage: last }).stage, [], humans.length ? "node" : "flow");
    ns.filter((n) => n.layer !== "upstream" && n.session === "human" && !n.human).forEach((n) => add(2, 0, "流れの途中に人がいる（人を置くのは 1 か所に絞る）", [n.id], n.stage));
    ns.filter((n) => n.kind === "gate" && !RISK[n.risk]).forEach((n) => add(1, 3, "戻しにくさが書かれていない", [n.id], n.stage));
    ns.filter((n) => n.kind === "gate" && n.risk === "irreversible" && !n.human).forEach((n) => add(1, 0, "戻せない変更を、人を置かずに通している", [n.id], n.stage));
    ns.filter((n) => (n.kind === "work" || n.kind === "gate") && !n.check && !(st.get(n.id).checks.length && st.get(n.id).checks.every((c) => c.check))).forEach((n) => add(4, 3, "判定（プログラムで評価できる形）が書かれていない", [n.id], n.stage));
    ns.filter((n) => n.layer !== "upstream" && !KIND[n.kind]).forEach((n) => add(5, 0, "ノードの種類（分ける・作業・コード・関門）が書かれていない", [n.id], n.stage));
    if (D.version == null) add(5, 0, "仕様書に version が無い（この図は version 2 の形として読んだ）", [], last, [], "flow");
    else if (![1, 2].includes(Number(D.version))) add(5, 0, `仕様書の version が ${D.version}（この図が読むのは version 1 と 2）`, [], last, [], "flow");
    problems.forEach((t) => add(5, 0, t, [], last, [], "flow"));
    // 同じ理由の文は 1 行にまとめる（「CI がまだ無い」が 3 つの検査にあれば、検査の名前を添えて 1 行）
    const list = [];
    out.forEach((o) => {
      const m = o.nodes.length && list.find((q) => q.tier === o.tier && q.text === o.text && q.nodes.length);
      if (m) { m.nodes = uniq(m.nodes.concat(o.nodes)); m.checks = uniq(m.checks.concat(o.checks)); m.sub = Math.min(m.sub, o.sub); } else list.push(Object.assign({}, o));
    });
    list.forEach((o, i) => { o.order = i; });
    list.sort((a, b) => a.tier - b.tier || a.sub - b.sub || stageIx.get(a.stage) - stageIx.get(b.stage) || a.order - b.order);
    list.forEach((o, i) => { o.key = "g" + i; o.checkTitles = o.checks.map((k) => checkByKey.get(k).title); });
    const res = { list, st };
    gapsMemo.set(p, res);
    return res;
  };
  const gapWho = (o) => o.nodes.length ? o.nodes.map(short).join("・") : o.scope === "stage" ? `段「${stName(o.stage)}」` : "流れ全体";
  const gapText = (o) => o.text + (o.checkTitles.length ? "（" + o.checkTitles.join("・") + "）" : "");

  // ---- 段階の差（c）。同じ段で無くなるものと足すものは「置き換え」にまとめる（決まったこと 8） ----
  const diffAt = (p) => {
    const none = { add: [], rem: [], rep: [], chg: [], edges: [] };
    if (p <= 0 || !phases.length) return none;
    const now = (o) => aliveAt(o, p), was = (o) => aliveAt(o, p - 1);
    let add = nodes.filter((n) => now(n) && !was(n)).map((n) => n.id), rem = nodes.filter((n) => !now(n) && was(n)).map((n) => n.id);
    const rep = [];
    stages.forEach((s) => {
      const a = add.filter((id) => byId.get(id).stage === s.id), r = rem.filter((id) => byId.get(id).stage === s.id);
      if (a.length && r.length) { rep.push({ from: r, to: a }); add = add.filter((x) => !a.includes(x)); rem = rem.filter((x) => !r.includes(x)); }
    });
    const chg = [];
    nodes.filter((n) => now(n) && was(n)).forEach((n) => {
      const w = [];
      n.checks.forEach((c) => {
        if (now(c) && !was(c)) w.push(["検査が増えた", c.title]);
        if (!now(c) && was(c)) w.push(["検査が無くなった", c.title]);
        if (now(c) && was(c) && textAt(c.gaps, p - 1) && !textAt(c.gaps, p)) w.push(["足りないものが埋まった", c.title]);
        if (now(c) && was(c) && !textAt(c.gaps, p - 1) && textAt(c.gaps, p)) w.push(["足りないものが出た", c.title]);
      });
      if (textAt(n.gaps, p - 1) && !textAt(n.gaps, p)) w.push(["足りないものが埋まった", ""]);
      if (!textAt(n.gaps, p - 1) && textAt(n.gaps, p)) w.push(["足りないものが出た", ""]);
      const i0 = INV(n, p - 1), i1 = INV(n, p);
      if (i0 !== i1) w.push(["人の関わり", INVL[i0] + " → " + INVL[i1]]);
      const what = uniq(w.map((x) => x[0])).map((k) => { const vs = w.filter((x) => x[0] === k && x[1]).map((x) => x[1]); return vs.length ? k + "：" + vs.join("・") : k; });
      if (what.length) chg.push({ id: n.id, what });
    });
    // 線：両端のノードが前の段階にも今の段階にも在るのに、線だけが増えた・無くなったもの
    const ed = edges.filter((e) => e.kind === "data" && now(e) !== was(e) && [e.from, e.to].every((id) => now(byId.get(id)) && was(byId.get(id)))).map((e) => ({ e, added: now(e) }));
    return { add, rem, rep, chg, edges: ed };
  };
  const changeOf = (df, id) => {
    if (df.add.includes(id)) return "足す";
    const r = df.rep.find((q) => q.to.includes(id) || q.from.includes(id));
    if (r) return "置き換え：" + r.from.map(short).join("・") + " → " + r.to.map(short).join("・");
    const c = df.chg.find((q) => q.id === id); if (c) return "変わる：" + c.what.join("／");
    if (df.rem.includes(id)) return "無くなる";
    return "変わらない";
  };

  // ---- 注記（ほかの道具が重ねるもの） ----
  // 形：{"version":1,"source":"道具の名前","title":"何の注記か","marks":[{"target":"node:ID | edge:ID | check:ノードID/検査ID","level":"info | warn | error | muted","label":"短い印","text":"詳しく"}]}
  // 注記は色を使わない小さな白い札で、見方 a・b に出す（c には出さない）。図に無い対象の注記は「表」に出す。
  const LEVEL = { info: 1, warn: 1, error: 1, muted: 1 };
  let O = null; const overlayRaw = document.getElementById("overlay").textContent.trim();
  if (!overlayRaw.startsWith("/*OVERLAY*/")) { try { O = JSON.parse(overlayRaw); } catch (e) { problems.push("注記の JSON を読めませんでした：" + e.message); } }
  const marks = (O && typeof O === "object" ? arr(O.marks) : []).map((m) => {
    m = m && typeof m === "object" ? m : {};
    const target = str(m.target), [type, ...rest] = target.split(":"), ref = rest.join(":");
    const level = LEVEL[str(m.level)] ? str(m.level) : "info";
    const found = (type === "node" && byId.has(ref)) || (type === "edge" && edgeById.has(ref)) || (type === "check" && checkByKey.has(ref));
    return { target, type, ref, level, label: str(m.label, "注記"), text: str(m.text), found };
  });
  const marksOf = groupBy(marks.filter((m) => m.found), (m) => m.type + ":" + m.ref);
  const mk = (k) => marksOf.get(k) || [];
  const source = O && O.source ? "（" + str(O.source) + "）" : "";
  const markLine = (m) => "✎ " + m.label + (m.text ? "：" + m.text : "") + source;

  // ---- 配置：すべての段階のノードで 1 回だけ ----
  const L = 172, W = Math.max(1440, Math.ceil(L + stages.length * 155.5 + 24)), R = W - 24, CW = (R - L) / stages.length;
  const GAP = 34, TW = CW - GAP, TH = 84, GY = 16, PAD = 28, TOP = 214;
  const cells = groupBy(nodes, (n) => n.role + ":" + n.stage);
  const P = new Map(), bands = [];
  let gy = TOP;
  roles.forEach((r) => {
    const c = Math.max(1, ...stages.map((s) => (cells.get(r.id + ":" + s.id) || []).length));
    const h = c * TH + (c - 1) * GY + PAD * 2;
    bands.push({ y: gy, h, r });
    stages.forEach((s, i) => {
      const cl = cells.get(r.id + ":" + s.id) || [];
      cl.forEach((n, k) => P.set(n.id, { x: L + i * CW + GAP / 2, y: gy + PAD + k * (TH + GY) + (c - cl.length) * (TH + GY) / 2 }));
    });
    gy += h;
  });
  const GB = gy;

  // ---- 線の割り当て：すべての段階・すべての種類で 1 回だけ ----
  const sameStage = (e) => byId.get(e.from).stage === byId.get(e.to).stage;
  const fwd = (e) => stageIx.get(byId.get(e.from).stage) < stageIx.get(byId.get(e.to).stage);
  const DATA = edges.filter((e) => e.kind === "data" && fwd(e));
  const VERT = edges.filter((e) => e.kind === "data" && sameStage(e));
  const BACK = edges.filter((e) => e.kind !== "data" || (!fwd(e) && !sameStage(e))); // 戻り道（と、前の段へ戻すデータの線）
  groupBy(DATA, (e) => e.from).forEach((l) => { l.sort((a, b) => P.get(a.to).y - P.get(b.to).y || a.i - b.i); l.forEach((e, i) => { e.oy = (i - (l.length - 1) / 2) * 11; }); });
  groupBy(DATA, (e) => e.to).forEach((l) => { l.sort((a, b) => P.get(a.from).y - P.get(b.from).y || a.i - b.i); l.forEach((e, i) => { e.iy = (i - (l.length - 1) / 2) * 11; }); });
  groupBy(DATA, (e) => stageIx.get(byId.get(e.to).stage)).forEach((l) => { l.sort((a, b) => (P.get(a.from).y - P.get(b.from).y) || (P.get(a.to).y - P.get(b.to).y) || a.i - b.i); l.forEach((e, i) => { e.lane = (i - (l.length - 1) / 2) * 5; }); });
  // 戻り道：元のカードの右の下から出て、右の隙間を下り、図の下の通り道を通り、戻り先のカードの下へ上がる
  BACK.sort((a, b) => stageIx.get(byId.get(b.from).stage) - stageIx.get(byId.get(a.from).stage) || P.get(a.from).y - P.get(b.from).y || a.i - b.i);
  BACK.forEach((e, i) => { e.ch = GB + 10 + i * 5; });
  groupBy(BACK, (e) => e.from).forEach((l) => l.forEach((e, i) => { e.bo = i; }));
  groupBy(BACK, (e) => e.to).forEach((l) => { l.sort((a, b) => P.get(b.from).x - P.get(a.from).x || a.i - b.i); l.forEach((e, i) => { e.bi = i; }); });
  const H = Math.max(GB + 64, (BACK.length ? BACK[BACK.length - 1].ch : GB) + 30);
  const rp = (pts, r = 9) => {
    let d = "M" + pts[0];
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const d1 = Math.min(r, Math.hypot(x - px, y - py) / 2), d2 = Math.min(r, Math.hypot(nx - x, ny - y) / 2);
      d += ` L${x - Math.sign(x - px) * d1},${y - Math.sign(y - py) * d1} Q${x},${y} ${x + Math.sign(nx - x) * d2},${y + Math.sign(ny - y) * d2}`;
    }
    return d + " L" + pts[pts.length - 1];
  };
  const head = (x, y, dir) => dir === "r" ? `M${x - 6},${y - 3.5}L${x},${y}L${x - 6},${y + 3.5}` : dir === "d" ? `M${x - 3.5},${y - 6}L${x},${y}L${x + 3.5},${y - 6}` : `M${x - 3.5},${y + 6}L${x},${y}L${x + 3.5},${y + 6}`;
  edges.forEach((e) => {
    const a = P.get(e.from), b = P.get(e.to);
    if (DATA.includes(e)) {
      const x1 = a.x + TW, y1 = a.y + TH / 2 + e.oy, x2 = b.x - 1, y2 = b.y + TH / 2 + e.iy, mx = b.x - GAP / 2 + e.lane;
      e.pts = Math.abs(y1 - y2) < 1 ? [[x1, y1], [x2, y2]] : [[x1, y1], [mx, y1], [mx, y2], [x2, y2]]; e.dir = "r";
    } else if (VERT.includes(e)) {
      const x = a.x + 28, down = b.y > a.y;
      e.pts = down ? [[x, a.y + TH], [x, b.y - 1]] : [[x, a.y], [x, b.y + TH + 1]]; e.dir = down ? "d" : "u";
    } else {
      const x1 = a.x + TW, y1 = a.y + TH - 8 - e.bo * 6, xg = a.x + TW + 5 + e.bo * 4, xt = b.x + TW - 14 - e.bi * 9;
      e.pts = [[x1, y1], [xg, y1], [xg, e.ch], [xt, e.ch], [xt, b.y + TH + 1]]; e.dir = "u"; e.back = true;
    }
    // 注記の札を置く所：いちばん長い横の線の真ん中
    let best = null;
    for (let i = 0; i < e.pts.length - 1; i++) { const [x, y] = e.pts[i], [nx, ny] = e.pts[i + 1]; if (y === ny && (!best || Math.abs(nx - x) > best.len)) best = { len: Math.abs(nx - x), x: (x + nx) / 2, y }; }
    e.mp = best || { x: (e.pts[0][0] + e.pts[e.pts.length - 1][0]) / 2, y: (e.pts[0][1] + e.pts[e.pts.length - 1][1]) / 2 };
  });

  // ---- 主な道（a）：最初の段から最後の段までの、データの線の最長の道 ----
  const mainPathAt = (p) => {
    const alive = (n) => aliveAt(n, p);
    const outE = groupBy(edges.filter((e) => e.kind === "data" && fwd(e) && aliveAt(e, p) && alive(byId.get(e.from)) && alive(byId.get(e.to))), (e) => e.from);
    const lastSt = stages[stages.length - 1].id, memo = new Map();
    const lg = (id) => {
      if (memo.has(id)) return memo.get(id);
      let best = null;
      for (const e of outE.get(id) || []) { const r = lg(e.to); if (r && (!best || r.length + 1 > best.length)) best = [e, ...r]; }
      if (!best && byId.get(id).stage === lastSt) best = [];
      memo.set(id, best); return best;
    };
    let mp = [];
    nodes.filter((n) => alive(n) && stageIx.get(n.stage) === 0).forEach((n) => { const r = lg(n.id); if (r && r.length > mp.length) mp = r; });
    return new Set(mp.map((e) => e.id));
  };

  // ---- 描画：図の骨組みは 1 回だけ作る ----
  const svg = sv("svg", { id: "v", tabindex: -1, role: "group", "aria-label": "流れの図（矢印キーでカードを移り、Enter で詳細を開く）", preserveAspectRatio: "xMinYMin meet" }, wrap);
  const defs = sv("defs", {}, svg);
  const fl = sv("filter", { id: "sh", x: "-10%", y: "-10%", width: "120%", height: "130%" }, defs);
  sv("feDropShadow", { dx: 0, dy: 1, stdDeviation: 1.6, "flood-color": "#5a4a30", "flood-opacity": 0.08 }, fl);
  const lay = {};
  ["bg", "dyn", "back", "thin", "main", "card", "top"].forEach((k) => { lay[k] = sv("g", { "data-layer": k }, svg); });
  const hl1 = tx(lay.bg, 40, 72, "", { "font-weight": 600, fill: HEADC, "font-family": GOTH, "aria-hidden": "true" });
  const hl2 = tx(lay.bg, 40, 102, "", { "font-size": 13, fill: SUB, "font-family": GOTH, "aria-hidden": "true" });
  stages.forEach((s, i) => {
    const x = L + i * CW + GAP / 2, g = sv("g", { "data-stage-id": s.id }, lay.bg);
    tx(g, x, TOP - 30, String(i + 1), { "font-size": 19, "font-weight": 600, fill: "#5d5850", "font-family": GOTH });
    tx(g, x + (i + 1 >= 10 ? 28 : 18), TOP - 30, s.name, { "font-size": 13, "font-weight": 600, fill: "#4a4642", "font-family": GOTH });
  });
  sv("line", { x1: 40, y1: TOP - 1, x2: R, y2: TOP - 1, stroke: RULE }, lay.bg);
  const roleLabels = [];
  bands.forEach((b, k) => {
    const g = sv("g", { "data-role-id": b.r.id }, lay.bg);
    if (k % 2) sv("rect", { x: 40, y: b.y, width: R - 40, height: b.h, rx: 14, fill: ALT }, g);
    tx(g, 52, b.y + PAD + 18, b.r.name, { "font-size": 12.5, "font-weight": 600, fill: "#4a4642", "font-family": GOTH });
    const sub = b.r.actor === "agent" ? "エージェント" : b.r.actor === "auto" ? "自動" : Number(b.r.people) > 0 ? b.r.people + " 人" : "";
    if (sub) tx(g, 52, b.y + PAD + 38, sub, { "font-size": 12, fill: SUB, "font-family": GOTH });
    if (b.r.missing) roleLabels.push(tx(g, 52, b.y + PAD + 56, "設計に無い役割", { "font-size": 11, fill: GAPINK, "font-family": GOTH }));
  });
  // 線
  edges.forEach((e) => {
    e.g = sv("g", { "data-edge-id": e.id }, e.back ? lay.back : lay.thin);
    e.line = sv("path", { d: rp(e.pts, e.back ? 6 : 9), fill: "none" }, e.g);
    e.head = sv("path", { d: head(e.pts[e.pts.length - 1][0], e.pts[e.pts.length - 1][1], e.dir), fill: "none" }, e.g);
    const ms = mk("edge:" + e.id);
    if (ms.length) {
      e.mark = sv("g", { "data-edge-id": e.id }, lay.top);
      const t = "✎ " + ms[0].label + (ms.length > 1 ? " ＋" + (ms.length - 1) : ""), wd = t.length * 10 + 12;
      sv("rect", { x: e.mp.x - wd / 2, y: e.mp.y - 8, width: wd, height: 15, rx: 4, fill: "#fff", stroke: "#cfc7ba", "stroke-width": 0.9 }, e.mark);
      tx(e.mark, e.mp.x, e.mp.y + 3.5, t, { "font-size": 10, fill: "#5d5850", "text-anchor": "middle", "font-family": GOTH });
      sv("title", {}, e.mark).textContent = ms.map(markLine).join("\n");
    }
  });
  // カード
  const room = TW - 19;
  const fitText = (t, s, tail = "") => { // 収まらなければ … で切る（字を縮めない）。tail（「 +1」など）は残す
    t.textContent = s + tail;
    if (t.getComputedTextLength() <= room) return;
    let s2 = s;
    while (s2.length > 1 && t.getComputedTextLength() > room) { s2 = s2.slice(0, -1); t.textContent = s2.replace(/[。、・（\s]+$/, "") + "…" + tail; }
  };
  // 2 行に折る位置：収まる長さ（cut）までで、助詞・空白・「・」の後ろか、文字の種類が変わる所のいちばん後ろ。無ければ cut。
  const kindOf = (ch) => /[ぁ-ゖ]/.test(ch) ? "h" : /[ァ-ヺー]/.test(ch) ? "k" : /[一-龯々]/.test(ch) ? "c" : /[A-Za-z0-9_\-]/.test(ch) ? "a" : "o";
  const breakAt = (s, cut) => {

      else if (n.gaps.length) nc.append(el("div", null, "足りない：" + n.gaps.map((g) => g.text).join("／")));
      if (marks.length) td(mk("node:" + n.id).map(markLine).join("／"));
      t.append(tr);
    });
    sec.append(t);
    const ed = edges.filter((e) => e.kind !== "data");
    if (ed.length) {
      sec.append(el("h3", null, "戻り道（直し・学び）"));
      const t2 = el("table"), h2 = el("tr"); ["種類", "から", "へ", "渡すもの"].concat(phases.length ? ["段階"] : []).forEach((x) => h2.append(el("th", null, x))); t2.append(h2);
      ed.forEach((e) => { const tr = el("tr"); tr.dataset.edgeId = e.id; [EDGE_KIND[e.kind], byId.get(e.from).title, byId.get(e.to).title, e.label + mk("edge:" + e.id).map((m) => " " + markLine(m)).join("")].concat(phases.length ? [span(e)] : []).forEach((x) => tr.append(el("td", null, x))); t2.append(tr); });
      sec.append(t2);
    }
    const lost = marks.filter((m) => !m.found);
    if (O) {
      sec.append(el("h3", null, "注記" + source + (O.title ? "：" + str(O.title) : "")));
      if (lost.length) { const ul = el("ul"); lost.forEach((m) => ul.append(el("li", null, m.target + "（図に無い対象）：" + m.label + (m.text ? "：" + m.text : "")))); sec.append(el("p", null, "図に無い対象の注記："), ul); }
      else sec.append(el("p", null, marks.length ? "注記はどれも図の上に出ている（見方 a・b）。" : "注記はありません。"));
    }
  };
  renderTable();

  // ---- 状態を URL の hash に持つ（#b&sel=n9 の形。開き直すと同じ見方・段階・選んだカードに戻る） ----
  const parse = () => {
    const parts = location.hash.slice(1).split("&").filter(Boolean), q = new Map();
    parts.forEach((x) => { const [k, ...v] = x.split("="); q.set(decodeURIComponent(k), decodeURIComponent(v.join("="))); });
    S.view = ["a", "b", "c"].find((v) => q.has(v)) || "a";
    S.table = q.has("table");
    S.p = phaseIx.has(q.get("p")) ? phaseIx.get(q.get("p")) : NP - 1;
    S.sel = byId.has(q.get("sel")) ? q.get("sel") : null;
    S.gap = q.get("g") || null;
    const g = S.view === "b" && S.gap ? gapsAt(CUR).list.find((o) => o.key === S.gap) : null;
    if (g) { S.selList = g.nodes.slice(); S.ck = g.checks.length ? g.checks.slice() : null; if (!S.sel) S.sel = g.nodes[0] || null; } else { S.gap = null; S.selList = null; S.ck = q.get("ck") && checkByKey.has(q.get("ck")) ? [q.get("ck")] : null; }
    if (S.sel) figStop = S.sel;
  };
  const sync = () => {
    const q = [S.view];
    if (S.view === "c" && S.p !== NP - 1 && phases.length) q.push("p=" + encodeURIComponent(phases[S.p].id));
    if (S.sel) q.push("sel=" + encodeURIComponent(S.sel));
    if (S.gap) q.push("g=" + S.gap);
    if (S.table) q.push("table");
    const nh = "#" + q.join("&");
    if (location.hash !== nh) history.replaceState(null, "", nh);
    render();
  };
  addEventListener("hashchange", () => { parse(); render(); });
  addEventListener("resize", () => { renderFold(); placeTip(); });
  parse();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeTip());
})();
</script>
